<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>eComPOS page search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* UX fixes: keyboard focus, touch targets, mobile text, reduced motion */
:focus-visible{outline:3px solid #0b5c5c;outline-offset:2px;border-radius:6px}
button:focus-visible,a:focus-visible,[role="button"]:focus-visible,[role="tab"]:focus-visible,[role="switch"]:focus-visible{outline:3px solid #0b5c5c;outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #0b5c5c;outline-offset:1px}
body{overflow-wrap:break-word}
@media (max-width:640px){input,select,textarea{font-size:16px !important}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}}
</style>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
<style>
.sb-mbtn,.sb-mclose{display:none}
@media (max-width: 900px){.sb-mbtn{display:flex !important}.sb-wrap{display:none}.sb-wrap.sb-mopen{display:block !important;position:fixed !important;top:0;left:0;right:0;width:auto !important;z-index:96;padding:10px 12px;background:#000000;box-sizing:border-box}.sb-wrap.sb-mopen .sb-mclose{display:flex !important}}
</style>
</helmet>
<button type="button" class="sb-mbtn" onClick="{{mOpenFn}}" aria-label="Open search" title="Search" style="position: fixed; top: 10px; right: 158px; z-index: 86; width: 42px; height: 42px; border-radius: 12px; border: 0; background: rgba(255, 255, 255, 0.14); color: #ffffff; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
<div class="{{mCls}}" style="position: relative; width: 100%; font-family: Inter, system-ui, -apple-system, sans-serif; color: #000000; letter-spacing: -0.01em">
<form role="search" onSubmit="{{submit}}" action="#" style="display: flex; align-items: center; gap: 8px; background: #ffffff; flex: 1; border: 1px solid rgba(0, 0, 0, 0.1); border-radius: 9999px; padding: 4px 4px 4px 16px; margin: 0; box-sizing: border-box">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5f5c5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<label for="{{inputId}}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{label}}</label>
<input id="{{inputId}}" type="search" enterkeyhint="search" inputmode="search" autocomplete="off" placeholder="{{placeholder}}" value="{{q}}" onInput="{{type}}" onFocus="{{focus}}" onKeyDown="{{key}}" aria-controls="{{listId}}" aria-expanded="{{openStr}}" style="border: 0; outline: none; font: inherit; font-size: 15px; flex: 1; background: transparent; min-width: 0">
<button type="submit" aria-label="Search {{scopeName}}" style="font-family: inherit; height: 40px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 16px; border-radius: 9999px; background: #0b5c5c; border: 0; color: #ffffff; font-size: 14px; font-weight: 500; cursor: pointer; box-shadow: rgba(69, 36, 219, 0.34) 0 4px 24px 0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Search</button>
<button type="button" class="sb-mclose" onClick="{{mCloseFn}}" aria-label="Close search" style="width: 40px; height: 40px; flex: none; border-radius: 9999px; border: 1px solid #d9d9d9; background: #ffffff; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; line-height: 1">×</button>
</form>
<sc-if value="{{open}}" hint-placeholder-val="{{false}}">
<div id="{{listId}}" role="region" aria-label="Search results in {{scopeName}}" style="position: absolute; top: 56px; left: 0; right: 0; min-width: 300px; z-index: 40; background: #ffffff; border-radius: 24px; padding: 10px; display: flex; flex-direction: column; gap: 2px; box-shadow: rgba(0, 0, 0, 0.12) 0 4px 24px 0; max-height: 420px; overflow-y: auto">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 4px 8px 8px; font-size: 12px; color: #5f5c5a"><span role="status" aria-live="polite" style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 9999px; background: #1f7a2a"></span>{{countLine}}</span><button type="button" onClick="{{close}}" style="font-family: inherit; font-size: 12px; font-weight: 500; padding: 6px 12px; border-radius: 9999px; border: 0; background: #c62828; cursor: pointer; color: #ffffff">Close</button></div>
<sc-for list="{{results}}" as="r" hint-placeholder-count="4">
<a href="{{r.href}}" onClick="{{r.go}}" style="display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; text-decoration: none; color: #000000; background: #ffffff">
<span style="font-size: 11px; padding: 3px 8px; border-radius: 9999px; background: #f2f4f5; white-space: nowrap; flex: none">{{r.kind}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 500">{{r.title}}</span><span style="font-size: 12px; color: #5f5c5a">{{r.sub}}</span></span>
</a>
</sc-for>
<sc-if value="{{none}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; color: #5f5c5a; padding: 10px 12px">Nothing in {{scopeName}} matches “{{q}}”. Try a name, number or phone.</span></sc-if>
</div>
</sc-if>
</div>
</x-dc>
