<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: MNest "m" mark. This single page serves both the POS and the
         online store (/shop), so these tags set the tab icon for both.
         SVG is preferred (crisp at any size); the 32px PNG is the fallback for
         browsers without SVG favicon support; apple-touch-icon is used when the
         site is saved to an iOS/iPadOS home screen. The tab icons have a
         transparent background; bump ?v= whenever they change so browsers
         drop their cached copy. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- The app manifest (store or POS), its home-screen icon and theme colour are added at start-up by
         src/lib/pwa.ts, depending on whether the address is the store or /pos. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MNest UnifiedPOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
