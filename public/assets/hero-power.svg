<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720">
<!-- Online store hero (built-in illustration 5 of 5): power protection. A voltage stabiliser with its meter and
     220V display, a UPS, and a fridge guard plugged into a wall socket, under a shield with a lightning bolt, on a
     navy-to-green light. Products sit between x 720 and 1570 so the heading on computers (left) and the
     right-aligned crop on phones never cover them. -->
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1240"/><stop offset="0.55" stop-color="#1f6b4a"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
<radialGradient id="glow" cx="0.7" cy="0.4" r="0.55"><stop offset="0" stop-color="#fff3c4" stop-opacity="0.6"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/></radialGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173d33"/><stop offset="1" stop-color="#0b1f1a"/></linearGradient>
<linearGradient id="grey" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b3f47"/><stop offset="0.5" stop-color="#5a5f69"/><stop offset="1" stop-color="#33363d"/></linearGradient>
<linearGradient id="black" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2b30"/><stop offset="1" stop-color="#0d0d10"/></linearGradient>
<linearGradient id="white" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e3e7ec"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#d3d8df"/></linearGradient>
<linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe680"/><stop offset="1" stop-color="#ffb020"/></linearGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/></filter>
</defs>
<rect width="1600" height="720" fill="url(#bg)"/><rect width="1600" height="720" fill="url(#glow)"/>
<path d="M560 600 L1600 570 L1600 720 L520 720 Z" fill="url(#floor)" opacity="0.85"/>

<!-- Shield with a lightning bolt -->
<g filter="url(#sh)" opacity="0.95">
<path d="M1060 70 L1180 110 V190 C1180 250 1130 290 1060 316 C990 290 940 250 940 190 V110 Z" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4"/>
<path d="M1076 116 L1018 206 H1058 L1040 276 L1104 178 H1062 Z" fill="url(#bolt)"/>
</g>

<!-- Voltage stabiliser -->
<g filter="url(#sh)">
<rect x="740" y="330" width="330" height="280" rx="18" fill="url(#grey)"/>
<rect x="740" y="330" width="330" height="40" rx="18" fill="#4a4e57"/>
<text x="762" y="357" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#e6e9ee" letter-spacing="1.5">STABILISER 5000VA</text>
<path d="M790 488 A90 90 0 0 1 970 488 Z" fill="#f4f1e8"/>
<path d="M800 488 A80 80 0 0 1 960 488" fill="none" stroke="#2ecc71" stroke-width="8"/>
<path d="M930 432 A80 80 0 0 1 960 488" fill="none" stroke="#e74c3c" stroke-width="8"/>
<line x1="880" y1="488" x2="912" y2="420" stroke="#1a1240" stroke-width="5" stroke-linecap="round"/>
<circle cx="880" cy="488" r="9" fill="#1a1240"/>
<rect x="990" y="402" width="64" height="34" rx="5" fill="#0b1a12"/>
<text x="996" y="426" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#4dff9a">220V</text>
<circle cx="1022" cy="470" r="13" fill="#2ecc71"/><circle cx="1022" cy="470" r="6" fill="#bfffd6"/>
<rect x="780" y="520" width="120" height="44" rx="8" fill="#2a2d33"/>
<g fill="#111"><rect x="796" y="532" width="8" height="20" rx="2"/><rect x="816" y="532" width="8" height="20" rx="2"/><circle cx="860" cy="542" r="9"/></g>
<rect x="760" y="606" width="24" height="10" rx="3" fill="#222"/><rect x="1026" y="606" width="24" height="10" rx="3" fill="#222"/>
</g>

<!-- UPS -->
<g filter="url(#sh)">
<rect x="1120" y="360" width="170" height="250" rx="14" fill="url(#black)"/>
<rect x="1144" y="390" width="122" height="54" rx="6" fill="#0d2a3a"/>
<text x="1154" y="414" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5fd4ff">UPS 1500VA</text>
<g fill="#5fd4ff"><rect x="1154" y="424" width="16" height="10" rx="2"/><rect x="1174" y="424" width="16" height="10" rx="2"/><rect x="1194" y="424" width="16" height="10" rx="2"/><rect x="1214" y="424" width="16" height="10" rx="2" opacity="0.35"/></g>
<circle cx="1205" cy="500" r="24" fill="#1f1f24" stroke="#2ecc71" stroke-width="5"/>
<path d="M1205 486 V500" stroke="#2ecc71" stroke-width="5" stroke-linecap="round"/>
<g fill="#2a2a30"><rect x="1144" y="548" width="122" height="6" rx="3"/><rect x="1144" y="562" width="122" height="6" rx="3"/><rect x="1144" y="576" width="122" height="6" rx="3"/></g>
</g>

<!-- Wall socket and fridge guard -->
<g filter="url(#sh)">
<rect x="1360" y="330" width="170" height="150" rx="16" fill="url(#white)"/>
<rect x="1384" y="352" width="122" height="106" rx="10" fill="#eef1f5" stroke="#c4cad3" stroke-width="2"/>
<rect x="1408" y="366" width="74" height="84" rx="10" fill="url(#white)" stroke="#b7bec8" stroke-width="2"/>
<text x="1416" y="392" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5b6270">FRIDGE</text>
<text x="1420" y="406" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5b6270">GUARD</text>
<circle cx="1445" cy="428" r="7" fill="#2ecc71"/>
</g>
<path d="M1445 480 C1445 540 1360 520 1330 580 S1300 610 1270 612" fill="none" stroke="#e6e9ee" stroke-width="8" stroke-linecap="round"/>
</svg>
