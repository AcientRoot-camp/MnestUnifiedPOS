<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
<!-- Branch illustration (inside every branch): the showroom. TVs on the wall, a row of fridges, air conditioners
     and a standing fan, a sales counter with a POS screen, ceiling lights and a tiled floor. Shown on each branch
     card after the outside view, until the Admin uploads real photos (data/web.ts BRANCH_ART). -->
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4efe8"/><stop offset="1" stop-color="#e6ddd0"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdbfa9"/><stop offset="1" stop-color="#a8977d"/></linearGradient>
<linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1b4c"/><stop offset="0.5" stop-color="#2f6fd6"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
<linearGradient id="screen2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c6b33"/><stop offset="1" stop-color="#2f9e4f"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b9bfc8"/><stop offset="0.5" stop-color="#f4f6f9"/><stop offset="1" stop-color="#a7adb7"/></linearGradient>
<linearGradient id="black" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2b30"/><stop offset="1" stop-color="#0d0d10"/></linearGradient>
<linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c98a52"/><stop offset="1" stop-color="#7a4a24"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/></filter>
</defs>
<rect width="1200" height="680" fill="url(#wall)"/>
<rect y="0" width="1200" height="56" fill="#1a1240"/>
<g fill="#fff3c4"><ellipse cx="200" cy="58" rx="60" ry="8"/><ellipse cx="600" cy="58" rx="60" ry="8"/><ellipse cx="1000" cy="58" rx="60" ry="8"/></g>
<g fill="#fff3c4" opacity="0.18"><path d="M140 60 L260 60 L320 360 L80 360 Z"/><path d="M540 60 L660 60 L720 360 L480 360 Z"/><path d="M940 60 L1060 60 L1120 360 L880 360 Z"/></g>
<!-- Floor tiles -->
<path d="M0 470 H1200 V680 H0 Z" fill="url(#floor)"/>
<g stroke="#b5a68e" stroke-width="2"><line x1="0" y1="530" x2="1200" y2="530"/><line x1="0" y1="600" x2="1200" y2="600"/><line x1="200" y1="470" x2="80" y2="680"/><line x1="450" y1="470" x2="400" y2="680"/><line x1="750" y1="470" x2="800" y2="680"/><line x1="1000" y1="470" x2="1120" y2="680"/></g>

<!-- TV wall -->
<g filter="url(#sh)">
<rect x="70" y="110" width="250" height="150" rx="8" fill="url(#black)"/><rect x="78" y="118" width="234" height="134" rx="4" fill="url(#screen)"/><circle cx="270" cy="160" r="20" fill="#ffd166" opacity="0.9"/>
<rect x="350" y="120" width="200" height="120" rx="8" fill="url(#black)"/><rect x="357" y="127" width="186" height="106" rx="4" fill="url(#screen2)"/>
<g stroke="#e9ffe9" stroke-width="2" fill="none" opacity="0.8"><path d="M372 230 L400 160 L500 160 L528 230"/><line x1="450" y1="160" x2="450" y2="230"/></g>
<rect x="70" y="290" width="200" height="120" rx="8" fill="url(#black)"/><rect x="77" y="297" width="186" height="106" rx="4" fill="url(#screen)"/>
<rect x="300" y="300" width="160" height="100" rx="8" fill="url(#black)"/><rect x="306" y="306" width="148" height="88" rx="4" fill="#6b3fa0"/>
<rect x="80" y="440" width="380" height="30" rx="6" fill="url(#wood)"/>
<rect x="110" y="420" width="120" height="20" rx="10" fill="url(#black)"/><rect x="300" y="414" width="90" height="26" rx="5" fill="url(#black)"/><text x="314" y="433" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#4aa3ff">DStv</text>
</g>

<!-- Air conditioners on the wall -->
<g filter="url(#sh)"><rect x="620" y="110" width="240" height="64" rx="16" fill="#ffffff"/><rect x="636" y="152" width="208" height="10" rx="5" fill="#c9ced6"/><circle cx="842" cy="128" r="4" fill="#2ecc71"/>
<rect x="890" y="110" width="240" height="64" rx="16" fill="#ffffff"/><rect x="906" y="152" width="208" height="10" rx="5" fill="#c9ced6"/><circle cx="1112" cy="128" r="4" fill="#2ecc71"/></g>

<!-- Row of fridges -->
<g filter="url(#sh)">
<rect x="620" y="220" width="110" height="250" rx="10" fill="url(#steel)"/><line x1="620" y1="300" x2="730" y2="300" stroke="#8d939d" stroke-width="2"/><rect x="714" y="236" width="6" height="50" rx="3" fill="#7d838d"/><rect x="714" y="316" width="6" height="90" rx="3" fill="#7d838d"/>
<rect x="745" y="230" width="110" height="240" rx="10" fill="#2b2b30"/><line x1="800" y1="230" x2="800" y2="470" stroke="#555" stroke-width="2"/><rect x="788" y="300" width="5" height="70" rx="2.5" fill="#888"/><rect x="807" y="300" width="5" height="70" rx="2.5" fill="#888"/>
<rect x="870" y="240" width="100" height="230" rx="10" fill="#ffffff"/><line x1="870" y1="310" x2="970" y2="310" stroke="#c4cad3" stroke-width="2"/><rect x="954" y="254" width="6" height="44" rx="3" fill="#9aa1ab"/><rect x="954" y="324" width="6" height="80" rx="3" fill="#9aa1ab"/>
</g>
<!-- Standing fan -->
<g filter="url(#sh)"><rect x="1043" y="300" width="10" height="160" rx="5" fill="#d9dde3"/><ellipse cx="1048" cy="470" rx="40" ry="10" fill="#c7ccd4"/><circle cx="1048" cy="270" r="54" fill="none" stroke="#9aa1ab" stroke-width="5"/><g fill="#7fc9ee"><ellipse cx="1048" cy="242" rx="12" ry="26"/><ellipse cx="1072" cy="284" rx="12" ry="26" transform="rotate(120 1072 284)"/><ellipse cx="1024" cy="284" rx="12" ry="26" transform="rotate(-120 1024 284)"/></g><circle cx="1048" cy="270" r="10" fill="#d9dde3"/></g>

<!-- Sales counter with POS screen -->
<g filter="url(#sh)">
<rect x="430" y="500" width="360" height="120" rx="10" fill="#1a1240"/>
<rect x="420" y="490" width="380" height="18" rx="6" fill="#f1ede6"/>
<rect x="520" y="430" width="120" height="70" rx="6" fill="url(#black)"/><rect x="527" y="437" width="106" height="52" rx="3" fill="#0b5c5c"/>
<g fill="#ffffff" opacity="0.85"><rect x="535" y="445" width="50" height="6" rx="3"/><rect x="535" y="457" width="80" height="6" rx="3"/><rect x="535" y="469" width="40" height="6" rx="3"/></g>
<rect x="570" y="490" width="20" height="6" fill="#2b2b30"/>
<rect x="680" y="462" width="60" height="30" rx="4" fill="url(#black)"/>
<text x="610" y="575" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffd166" letter-spacing="3">PAY HERE</text>
</g>
</svg>
