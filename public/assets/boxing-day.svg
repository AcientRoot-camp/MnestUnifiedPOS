<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<!-- Boxing Day (26 December, components/Seasonal.tsx): two people exchanging a wrapped gift, smiling, under festive
     bunting with confetti and a small Christmas tree, on a warm evening light. -->
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1240"/><stop offset="0.6" stop-color="#6b3fa0"/><stop offset="1" stop-color="#ffb36b"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.55" r="0.5"><stop offset="0" stop-color="#fff0c8" stop-opacity="0.6"/><stop offset="1" stop-color="#fff0c8" stop-opacity="0"/></radialGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d1a55"/><stop offset="1" stop-color="#160c33"/></linearGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/></filter>
</defs>
<rect width="640" height="360" fill="url(#bg)"/><rect width="640" height="360" fill="url(#glow)"/>
<path d="M0 312 L640 300 L640 360 L0 360 Z" fill="url(#floor)"/>

<!-- Bunting -->
<path d="M0 26 Q320 86 640 26" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
<g><path d="M40 34 l22 4 l-14 22 z" fill="#e63946"/><path d="M100 44 l22 4 l-14 22 z" fill="#ffd166"/><path d="M160 52 l22 3 l-13 22 z" fill="#2a9d8f"/><path d="M220 57 l22 2 l-12 22 z" fill="#e63946"/><path d="M280 60 l22 1 l-11 22 z" fill="#ffd166"/>
<path d="M340 60 l22 -1 l-10 22 z" fill="#2a9d8f"/><path d="M400 57 l22 -2 l-10 22 z" fill="#e63946"/><path d="M460 52 l22 -3 l-9 22 z" fill="#ffd166"/><path d="M520 44 l22 -4 l-8 22 z" fill="#2a9d8f"/><path d="M580 34 l22 -4 l-8 22 z" fill="#e63946"/></g>
<!-- Confetti -->
<g><rect x="70" y="110" width="8" height="4" rx="1" fill="#ffd166" transform="rotate(30 74 112)"/><rect x="560" y="120" width="8" height="4" rx="1" fill="#5ad1ff" transform="rotate(-20 564 122)"/><circle cx="130" cy="170" r="3" fill="#ff5a5a"/><circle cx="520" cy="180" r="3" fill="#ffd166"/><rect x="300" y="96" width="8" height="4" rx="1" fill="#ff5a5a" transform="rotate(50 304 98)"/><rect x="350" y="110" width="8" height="4" rx="1" fill="#5ad1ff" transform="rotate(-40 354 112)"/><circle cx="40" cy="240" r="3" fill="#5ad1ff"/><circle cx="600" cy="250" r="3" fill="#ff5a5a"/></g>

<!-- Small Christmas tree (right) -->
<g filter="url(#sh)"><rect x="566" y="282" width="12" height="20" fill="#7a4a24"/><path d="M572 180 L606 236 H590 L616 286 H528 L554 236 H538 Z" fill="#1f8a4c"/><circle cx="572" cy="176" r="6" fill="#ffd166"/><circle cx="560" cy="250" r="4" fill="#ff5a5a"/><circle cx="584" cy="262" r="4" fill="#5ad1ff"/><circle cx="574" cy="226" r="4" fill="#ffd166"/></g>

<!-- Person on the left, giving the gift -->
<g filter="url(#sh)">
<path d="M196 312 L204 248 H226 L222 312 Z" fill="#1d2b4f"/><path d="M228 312 L232 248 H254 L262 312 Z" fill="#1d2b4f"/>
<rect x="196" y="308" width="30" height="10" rx="5" fill="#111"/><rect x="232" y="308" width="32" height="10" rx="5" fill="#111"/>
<path d="M190 256 C190 196 206 166 230 166 C254 166 270 196 270 256 Z" fill="#f2b705"/>
<g fill="#1f8a4c"><rect x="196" y="196" width="68" height="8"/><rect x="196" y="222" width="68" height="8"/></g>
<g fill="#e63946"><rect x="210" y="176" width="8" height="78"/><rect x="242" y="176" width="8" height="78"/></g>
<rect x="222" y="148" width="16" height="20" rx="6" fill="#7a4a2e"/>
<circle cx="230" cy="124" r="30" fill="#8a5636"/>
<path d="M200 118 C200 92 216 84 230 84 C246 84 262 94 260 118 C252 104 240 100 230 100 C218 100 208 106 200 118 Z" fill="#1b1b1b"/>
<circle cx="220" cy="124" r="3" fill="#1b1b1b"/><circle cx="242" cy="124" r="3" fill="#1b1b1b"/>
<path d="M220 138 Q231 148 242 138" fill="none" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<path d="M262 190 C284 196 296 204 306 212" fill="none" stroke="#f2b705" stroke-width="18" stroke-linecap="round"/>
<path d="M200 192 C220 214 260 222 300 222" fill="none" stroke="#f2b705" stroke-width="18" stroke-linecap="round"/>
<circle cx="308" cy="214" r="9" fill="#8a5636"/><circle cx="302" cy="224" r="9" fill="#8a5636"/>
</g>

<!-- Person on the right, receiving the gift -->
<g filter="url(#sh)">
<path d="M380 312 L386 252 H408 L406 312 Z" fill="#3d2a1e"/><path d="M412 312 L414 252 H436 L444 312 Z" fill="#3d2a1e"/>
<rect x="378" y="308" width="30" height="10" rx="5" fill="#111"/><rect x="414" y="308" width="32" height="10" rx="5" fill="#111"/>
<path d="M370 262 C370 196 386 166 410 166 C434 166 450 196 450 262 Z" fill="#e63946"/>
<path d="M390 168 L410 196 L430 168" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
<rect x="402" y="148" width="16" height="20" rx="6" fill="#6b3f26"/>
<circle cx="410" cy="124" r="30" fill="#6b3f26"/>
<path d="M378 128 C372 92 396 80 412 82 C434 82 448 96 444 128 C438 108 426 100 412 100 C398 100 386 108 378 128 Z" fill="#1b1b1b"/>
<circle cx="432" cy="86" r="14" fill="#1b1b1b"/>
<circle cx="400" cy="124" r="3" fill="#1b1b1b"/><circle cx="420" cy="124" r="3" fill="#1b1b1b"/>
<path d="M398 138 Q410 150 422 138" fill="none" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<path d="M376 192 C356 198 346 206 336 214" fill="none" stroke="#e63946" stroke-width="18" stroke-linecap="round"/>
<path d="M444 194 C424 216 382 222 342 222" fill="none" stroke="#e63946" stroke-width="18" stroke-linecap="round"/>
<circle cx="334" cy="214" r="9" fill="#6b3f26"/><circle cx="340" cy="224" r="9" fill="#6b3f26"/>
</g>

<!-- The gift between them -->
<g filter="url(#sh)">
<rect x="290" y="180" width="62" height="50" rx="6" fill="#2a9d8f"/>
<rect x="316" y="180" width="10" height="50" fill="#ffd166"/><rect x="290" y="198" width="62" height="10" fill="#ffd166"/>
<path d="M321 180 C302 160 294 174 321 180 C348 174 340 160 321 180 Z" fill="#ffd166"/>
</g>
<!-- Sparkles round the gift -->
<g fill="#fff6c9"><path d="M321 140 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z"/><path d="M276 162 l3 6 l6 3 l-6 3 l-3 6 l-3 -6 l-6 -3 l6 -3 z"/><path d="M366 160 l3 6 l6 3 l-6 3 l-3 6 l-3 -6 l-6 -3 l6 -3 z"/></g>
</svg>
