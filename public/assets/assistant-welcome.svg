<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240">
<!-- Inside the shop assistant chat (pages/store/Chat.tsx): the shop assistant at the shop counter, waving hello,
     with a TV and a fridge on display behind her and help bubbles floating up (delivery, orders, prices). -->
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1d63"/><stop offset="0.6" stop-color="#5a3aa8"/><stop offset="1" stop-color="#ffb36b"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#fff0c8" stop-opacity="0.45"/><stop offset="1" stop-color="#fff0c8" stop-opacity="0"/></radialGradient>
<linearGradient id="counter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c98a52"/><stop offset="1" stop-color="#7a4a24"/></linearGradient>
<linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1b4c"/><stop offset="0.5" stop-color="#2f6fd6"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b9bfc8"/><stop offset="0.5" stop-color="#f4f6f9"/><stop offset="1" stop-color="#a7adb7"/></linearGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/></filter>
</defs>
<rect width="640" height="240" fill="url(#bg)"/><rect width="640" height="240" fill="url(#glow)"/>

<!-- Products on display behind the counter -->
<g filter="url(#sh)" opacity="0.95">
<rect x="56" y="44" width="150" height="92" rx="8" fill="#16161a"/><rect x="63" y="51" width="136" height="78" rx="4" fill="url(#screen)"/>
<circle cx="168" cy="80" r="14" fill="#ffd166" opacity="0.9"/>
<rect x="124" y="136" width="14" height="10" fill="#16161a"/>
<rect x="466" y="30" width="78" height="150" rx="10" fill="url(#steel)"/>
<line x1="466" y1="86" x2="544" y2="86" stroke="#8d939d" stroke-width="2"/>
<rect x="532" y="44" width="5" height="30" rx="2.5" fill="#7d838d"/><rect x="532" y="98" width="5" height="54" rx="2.5" fill="#7d838d"/>
<rect x="562" y="70" width="52" height="40" rx="6" fill="#16161a"/><rect x="567" y="75" width="42" height="24" rx="3" fill="#2f6fd6"/>
</g>

<!-- Help bubbles -->
<g filter="url(#sh)">
<g transform="translate(232 26)"><rect width="44" height="34" rx="12" fill="#ffffff"/><path d="M12 34 l-2 10 l10 -10 z" fill="#ffffff"/>
<rect x="7" y="9" width="18" height="13" rx="2" fill="#2a9d8f"/><path d="M25 13 h6 l5 5 v4 h-11 z" fill="#2a9d8f"/><rect x="27" y="14.5" width="4" height="3" rx="0.5" fill="#ffffff"/><circle cx="13" cy="24" r="3.2" fill="#1a1240"/><circle cx="31" cy="24" r="3.2" fill="#1a1240"/></g>
<g transform="translate(372 18)"><rect width="44" height="34" rx="12" fill="#ffffff"/><path d="M32 34 l2 10 l-10 -10 z" fill="#ffffff"/>
<path d="M12 12 h20 v16 h-20 z" fill="#f2b705"/><path d="M12 12 l10 6 l10 -6" fill="none" stroke="#1a1240" stroke-width="2"/></g>
<g transform="translate(446 112)"><rect width="40" height="32" rx="11" fill="#ffffff"/><path d="M8 32 l-2 9 l9 -9 z" fill="#ffffff"/>
<path d="M11 9 h11 l8 8 l-9 9 l-10 -10 z" fill="#e63946"/><circle cx="16" cy="14" r="2" fill="#ffffff"/></g>
</g>

<!-- Shop assistant (upper body) waving -->
<g filter="url(#sh)">
<path d="M246 246 C248 192 274 172 320 172 C366 172 392 192 394 246 Z" fill="#0b5c5c"/>
<path d="M300 173 L320 196 L340 173 C334 171 328 170 320 170 C312 170 306 171 300 173 Z" fill="#ffffff"/>
<rect x="346" y="196" width="26" height="9" rx="2" fill="#f2b705"/>
<rect x="309" y="150" width="22" height="24" rx="8" fill="#7a4a2e"/>
<circle cx="320" cy="66" r="20" fill="#1b1b1b"/>
<ellipse cx="320" cy="114" rx="34" ry="38" fill="#8a5636"/>
<path d="M286 110 C283 80 300 70 320 70 C342 70 358 82 354 110 C348 95 336 88 320 88 C304 88 292 95 286 110 Z" fill="#1b1b1b"/>
<ellipse cx="307" cy="116" rx="4" ry="4.6" fill="#1b1b1b"/><ellipse cx="333" cy="116" rx="4" ry="4.6" fill="#1b1b1b"/>
<circle cx="308.5" cy="114.5" r="1.3" fill="#ffffff"/><circle cx="334.5" cy="114.5" r="1.3" fill="#ffffff"/>
<ellipse cx="299" cy="128" rx="6" ry="3.4" fill="#e07a5f" opacity="0.45"/><ellipse cx="341" cy="128" rx="6" ry="3.4" fill="#e07a5f" opacity="0.45"/>
<path d="M307 132 Q320 144 333 132" fill="none" stroke="#1b1b1b" stroke-width="3.2" stroke-linecap="round"/>
<path d="M284 114 C284 80 356 80 356 114" fill="none" stroke="#2b2b30" stroke-width="5" stroke-linecap="round"/>
<rect x="278" y="106" width="12" height="21" rx="5" fill="#f2b705"/><rect x="350" y="106" width="12" height="21" rx="5" fill="#f2b705"/>
<path d="M285 126 C288 140 297 143 306 140" fill="none" stroke="#2b2b30" stroke-width="3.4" stroke-linecap="round"/>
<circle cx="307" cy="140" r="4" fill="#2b2b30"/>
<!-- Waving arm -->
<path d="M388 206 C404 184 410 160 412 136" fill="none" stroke="#0b5c5c" stroke-width="22" stroke-linecap="round"/>
<ellipse cx="413" cy="122" rx="13" ry="15" fill="#8a5636"/>
<g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"><path d="M432 108 l8 -6"/><path d="M436 122 l10 0"/><path d="M430 94 l5 -8"/></g>
</g>

<!-- Counter in front -->
<g filter="url(#sh)">
<rect x="0" y="206" width="640" height="34" fill="url(#counter)"/>
<rect x="0" y="200" width="640" height="10" fill="#f1ede6"/>
</g>
</svg>
