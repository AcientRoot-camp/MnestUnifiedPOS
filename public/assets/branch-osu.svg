<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
<!-- Branch illustration (Osu, Accra): a modern two-storey shop house with a teal trim, a striped awning and big
     glass windows showing TVs and fridges, on a bright Accra afternoon with a palm tree and a street lamp.
     Used on the store's branch cards until the Admin uploads real photos (data/web.ts BRANCH_ART). -->
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#ffe2c2"/></linearGradient>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6efe4"/><stop offset="1" stop-color="#e8dccb"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d3550"/><stop offset="1" stop-color="#3f6a8f"/></linearGradient>
<linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b5f68"/><stop offset="1" stop-color="#3b3e45"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/></filter>
</defs>
<rect width="1200" height="680" fill="url(#sky)"/>
<circle cx="1040" cy="110" r="56" fill="#fff3c4" opacity="0.9"/>
<g fill="#ffffff" opacity="0.85"><ellipse cx="220" cy="110" rx="80" ry="22"/><ellipse cx="280" cy="96" rx="56" ry="20"/><ellipse cx="760" cy="80" rx="70" ry="18"/></g>
<!-- Pavement and road -->
<rect y="560" width="1200" height="40" fill="#d9d2c4"/><rect y="600" width="1200" height="80" fill="url(#road)"/>
<g fill="#f4f1ea"><rect x="60" y="636" width="90" height="8" rx="4"/><rect x="300" y="636" width="90" height="8" rx="4"/><rect x="540" y="636" width="90" height="8" rx="4"/><rect x="780" y="636" width="90" height="8" rx="4"/><rect x="1020" y="636" width="90" height="8" rx="4"/></g>

<!-- Palm tree -->
<g><path d="M150 560 C140 460 150 380 170 300" fill="none" stroke="#8a5a2b" stroke-width="18" stroke-linecap="round"/>
<g fill="#2f9e5a"><path d="M170 300 C120 270 80 280 50 310 C100 296 140 300 170 300 Z"/><path d="M170 300 C150 250 110 230 70 236 C120 252 150 276 170 300 Z"/><path d="M170 300 C200 250 250 236 290 246 C240 256 200 276 170 300 Z"/><path d="M170 300 C220 280 270 290 300 320 C250 306 210 302 170 300 Z"/><path d="M170 300 C176 250 160 214 140 196 C164 240 168 270 170 300 Z"/></g></g>

<!-- Shop house -->
<g filter="url(#sh)">
<rect x="300" y="150" width="640" height="410" rx="6" fill="url(#wall)"/>
<rect x="290" y="134" width="660" height="26" rx="6" fill="#0b5c5c"/>
<!-- Upper floor windows -->
<g><rect x="340" y="190" width="120" height="96" rx="6" fill="url(#glass)"/><rect x="500" y="190" width="120" height="96" rx="6" fill="url(#glass)"/><rect x="660" y="190" width="120" height="96" rx="6" fill="url(#glass)"/><rect x="820" y="190" width="80" height="96" rx="6" fill="url(#glass)"/>
<g stroke="#e8dccb" stroke-width="5"><line x1="400" y1="190" x2="400" y2="286"/><line x1="560" y1="190" x2="560" y2="286"/><line x1="720" y1="190" x2="720" y2="286"/></g></g>
<!-- Sign board -->
<rect x="360" y="306" width="520" height="54" rx="10" fill="#1a1240"/>
<text x="620" y="342" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#ffd166" letter-spacing="3">ELECTRONICS &amp; APPLIANCES</text>
<!-- Awning -->
<path d="M320 372 H920 L944 412 H296 Z" fill="#e63946"/>
<g fill="#ffffff"><path d="M368 372 H416 L428 412 H380 Z"/><path d="M464 372 H512 L524 412 H476 Z"/><path d="M560 372 H608 L620 412 H572 Z"/><path d="M656 372 H704 L716 412 H668 Z"/><path d="M752 372 H800 L812 412 H764 Z"/><path d="M848 372 H896 L908 412 H860 Z"/></g>
<!-- Shop windows with products -->
<rect x="330" y="420" width="250" height="140" rx="6" fill="url(#glass)"/>
<rect x="352" y="440" width="110" height="66" rx="4" fill="#0d1b4c"/><rect x="358" y="446" width="98" height="54" rx="2" fill="#2f6fd6"/><circle cx="430" cy="466" r="12" fill="#ffd166"/>
<rect x="480" y="436" width="56" height="112" rx="6" fill="#d9dde3"/><line x1="480" y1="476" x2="536" y2="476" stroke="#9aa1ab" stroke-width="2"/>
<rect x="660" y="420" width="250" height="140" rx="6" fill="url(#glass)"/>
<rect x="680" y="440" width="120" height="30" rx="8" fill="#eef1f5"/><rect x="820" y="436" width="70" height="112" rx="6" fill="#d9dde3"/><line x1="820" y1="486" x2="890" y2="486" stroke="#9aa1ab" stroke-width="2"/>
<circle cx="730" cy="520" r="28" fill="none" stroke="#eef1f5" stroke-width="4"/><line x1="730" y1="548" x2="730" y2="560" stroke="#eef1f5" stroke-width="4"/>
<!-- Door -->
<rect x="590" y="420" width="60" height="140" rx="4" fill="#123048"/><rect x="598" y="430" width="44" height="118" rx="2" fill="url(#glass)"/><rect x="634" y="486" width="4" height="20" rx="2" fill="#ffd166"/>
</g>
<!-- Plants and lamp -->
<g><rect x="944" y="520" width="40" height="40" rx="6" fill="#b5651d"/><circle cx="964" cy="506" r="26" fill="#2f9e5a"/>
<rect x="256" y="520" width="40" height="40" rx="6" fill="#b5651d"/><circle cx="276" cy="506" r="26" fill="#2f9e5a"/>
<rect x="1060" y="300" width="10" height="260" fill="#3b3e45"/><path d="M1065 300 q0 -24 40 -24" fill="none" stroke="#3b3e45" stroke-width="8"/><rect x="1094" y="276" width="34" height="14" rx="6" fill="#3b3e45"/><ellipse cx="1111" cy="294" rx="14" ry="5" fill="#fff3c4"/></g>
</svg>
