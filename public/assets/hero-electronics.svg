<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720">
<!-- Online store hero (default when no photos are uploaded): a showroom of a smart TV with soundbar and DStv decoder,
     a double-door fridge, a wall-mounted split air conditioner and a standing fan, on the store's navy-to-amber light. -->
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1240"/><stop offset="0.55" stop-color="#3b23b8"/><stop offset="1" stop-color="#ff9a3d"/></linearGradient>
<radialGradient id="glow" cx="0.72" cy="0.42" r="0.55"><stop offset="0" stop-color="#ffd9a8" stop-opacity="0.8"/><stop offset="1" stop-color="#ffd9a8" stop-opacity="0"/></radialGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1d63"/><stop offset="1" stop-color="#120b30"/></linearGradient>
<linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1b4c"/><stop offset="0.45" stop-color="#2f6fd6"/><stop offset="0.75" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b9bfc8"/><stop offset="0.45" stop-color="#f4f6f9"/><stop offset="1" stop-color="#a7adb7"/></linearGradient>
<linearGradient id="white" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e6e9ee"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#d8dce3"/></linearGradient>
<linearGradient id="black" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2b30"/><stop offset="1" stop-color="#0d0d10"/></linearGradient>
<linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c98a52"/><stop offset="1" stop-color="#7a4a24"/></linearGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/></filter>
</defs>
<rect width="1600" height="720" fill="url(#bg)"/><rect width="1600" height="720" fill="url(#glow)"/>
<path d="M560 590 L1600 560 L1600 720 L520 720 Z" fill="url(#floor)" opacity="0.85"/>

<!-- Split air conditioner on the wall -->
<g filter="url(#sh)">
<rect x="1230" y="70" width="330" height="92" rx="22" fill="url(#white)"/>
<rect x="1250" y="132" width="290" height="14" rx="7" fill="#c9ced6"/>
<rect x="1252" y="138" width="286" height="4" rx="2" fill="#9aa1ab"/>
<circle cx="1528" cy="98" r="5" fill="#2ecc71"/>
<text x="1258" y="106" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#5b6270" letter-spacing="2">INVERTER</text>
</g>
<g opacity="0.55" stroke="#dff3ff" stroke-width="4" stroke-linecap="round" fill="none">
<path d="M1290 176 q10 22 0 44"/><path d="M1350 178 q10 26 0 52"/><path d="M1410 178 q10 26 0 52"/><path d="M1470 176 q10 22 0 44"/>
</g>

<!-- TV console -->
<g filter="url(#sh)">
<rect x="740" y="520" width="500" height="60" rx="10" fill="url(#wood)"/>
<rect x="760" y="580" width="16" height="34" rx="4" fill="#5a3518"/><rect x="1204" y="580" width="16" height="34" rx="4" fill="#5a3518"/>
<line x1="990" y1="530" x2="990" y2="570" stroke="#6b3f1d" stroke-width="3"/>
</g>

<!-- Smart TV -->
<g filter="url(#sh)">
<rect x="760" y="196" width="460" height="276" rx="12" fill="url(#black)"/>
<rect x="772" y="208" width="436" height="248" rx="6" fill="url(#screen)"/>
<circle cx="1110" cy="300" r="46" fill="#ffd166" opacity="0.95"/>
<path d="M772 400 C 860 360, 940 380, 1010 350 S 1150 330, 1208 360 L1208 456 L772 456 Z" fill="#1a1240" opacity="0.85"/>
<path d="M772 425 C 870 400, 960 420, 1050 395 S 1170 395, 1208 405 L1208 456 L772 456 Z" fill="#0b0730"/>
<text x="790" y="244" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff" opacity="0.9">4K UHD</text>
<rect x="975" y="472" width="30" height="34" fill="#18181c"/><rect x="930" y="504" width="120" height="12" rx="6" fill="#18181c"/>
</g>

<!-- Soundbar and DStv decoder on the console -->
<g filter="url(#sh)">
<rect x="800" y="486" width="170" height="26" rx="13" fill="url(#black)"/>
<g fill="#3a3a42"><circle cx="830" cy="499" r="3"/><circle cx="845" cy="499" r="3"/><circle cx="860" cy="499" r="3"/><circle cx="910" cy="499" r="3"/><circle cx="925" cy="499" r="3"/><circle cx="940" cy="499" r="3"/></g>
<rect x="1060" y="480" width="140" height="34" rx="6" fill="url(#black)"/>
<text x="1078" y="503" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#4aa3ff">DStv</text>
<circle cx="1182" cy="497" r="4" fill="#2ecc71"/>
</g>

<!-- Double-door fridge -->
<g filter="url(#sh)">
<rect x="1270" y="200" width="180" height="420" rx="16" fill="url(#steel)"/>
<line x1="1270" y1="340" x2="1450" y2="340" stroke="#8d939d" stroke-width="3"/>
<rect x="1424" y="232" width="9" height="80" rx="4.5" fill="#7d838d"/>
<rect x="1424" y="368" width="9" height="140" rx="4.5" fill="#7d838d"/>
<rect x="1290" y="360" width="56" height="34" rx="6" fill="#1f2a3a"/>
<text x="1298" y="383" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5fd4ff">3°C</text>
<rect x="1282" y="618" width="20" height="10" rx="3" fill="#555"/><rect x="1418" y="618" width="20" height="10" rx="3" fill="#555"/>
</g>

<!-- Standing fan -->
<g filter="url(#sh)">
<rect x="1513" y="410" width="10" height="190" rx="5" fill="#d9dde3"/>
<ellipse cx="1518" cy="612" rx="46" ry="12" fill="#c7ccd4"/>
<circle cx="1518" cy="370" r="62" fill="none" stroke="#eef1f5" stroke-width="5"/>
<g fill="#9fd8ff" opacity="0.9"><ellipse cx="1518" cy="336" rx="14" ry="30"/><ellipse cx="1548" cy="384" rx="14" ry="30" transform="rotate(120 1548 384)"/><ellipse cx="1488" cy="384" rx="14" ry="30" transform="rotate(-120 1488 384)"/></g>
<circle cx="1518" cy="370" r="12" fill="#eef1f5"/>
</g>
</svg>
