<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720">
<!-- Online store hero (built-in illustration 2 of 5): kitchen and laundry. A microwave on a kitchen counter, a
     front-load washing machine and a hot-and-cold water dispenser, on a navy-to-teal light. Products sit between
     x 700 and 1570 so the heading on computers (left) and the right-aligned crop on phones never cover them. -->
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1240"/><stop offset="0.55" stop-color="#0b5c5c"/><stop offset="1" stop-color="#ffc46b"/></linearGradient>
<radialGradient id="glow" cx="0.74" cy="0.42" r="0.55"><stop offset="0" stop-color="#d8fff4" stop-opacity="0.55"/><stop offset="1" stop-color="#d8fff4" stop-opacity="0"/></radialGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#123b47"/><stop offset="1" stop-color="#0a1f2a"/></linearGradient>
<linearGradient id="white" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e3e7ec"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#d3d8df"/></linearGradient>
<linearGradient id="black" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2b30"/><stop offset="1" stop-color="#0d0d10"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c2b3a"/><stop offset="1" stop-color="#3d5a73"/></linearGradient>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fe3ff" stop-opacity="0.95"/><stop offset="1" stop-color="#3aa0e0" stop-opacity="0.95"/></linearGradient>
<linearGradient id="counter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1ede6"/><stop offset="1" stop-color="#cfc8bc"/></linearGradient>
<linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c98a52"/><stop offset="1" stop-color="#7a4a24"/></linearGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/></filter>
</defs>
<rect width="1600" height="720" fill="url(#bg)"/><rect width="1600" height="720" fill="url(#glow)"/>
<path d="M560 600 L1600 570 L1600 720 L520 720 Z" fill="url(#floor)" opacity="0.85"/>

<!-- Kitchen counter with cupboards -->
<g filter="url(#sh)">
<rect x="700" y="470" width="440" height="140" rx="8" fill="url(#wood)"/>
<rect x="690" y="456" width="460" height="22" rx="6" fill="url(#counter)"/>
<line x1="920" y1="486" x2="920" y2="600" stroke="#6b3f1d" stroke-width="3"/>
<rect x="890" y="520" width="8" height="40" rx="4" fill="#e8d9c4"/><rect x="942" y="520" width="8" height="40" rx="4" fill="#e8d9c4"/>
</g>

<!-- Microwave on the counter -->
<g filter="url(#sh)">
<rect x="740" y="330" width="290" height="126" rx="12" fill="url(#black)"/>
<rect x="756" y="346" width="190" height="94" rx="6" fill="url(#glass)"/>
<rect x="770" y="360" width="60" height="6" rx="3" fill="#ffffff" opacity="0.25"/>
<rect x="960" y="350" width="56" height="24" rx="4" fill="#0b1a12"/>
<text x="966" y="368" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#4dff9a">2:30</text>
<g fill="#4a4a52"><circle cx="972" cy="392" r="5"/><circle cx="988" cy="392" r="5"/><circle cx="1004" cy="392" r="5"/><circle cx="972" cy="408" r="5"/><circle cx="988" cy="408" r="5"/><circle cx="1004" cy="408" r="5"/></g>
<circle cx="988" cy="430" r="9" fill="#5a5a64"/>
</g>

<!-- Front-load washing machine -->
<g filter="url(#sh)">
<rect x="1170" y="300" width="210" height="310" rx="16" fill="url(#white)"/>
<rect x="1170" y="300" width="210" height="62" rx="16" fill="#eef1f5"/>
<line x1="1170" y1="362" x2="1380" y2="362" stroke="#c4cad3" stroke-width="2"/>
<circle cx="1342" cy="331" r="16" fill="#d5dae2" stroke="#9aa1ab" stroke-width="3"/>
<rect x="1190" y="320" width="70" height="22" rx="4" fill="#1f2a3a"/>
<text x="1197" y="337" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5fd4ff">40°C</text>
<circle cx="1275" cy="480" r="86" fill="#c9ced6"/>
<circle cx="1275" cy="480" r="70" fill="url(#glass)"/>
<path d="M1209 492 C1235 470 1260 510 1290 488 S1335 478 1341 492 A70 70 0 0 1 1209 492 Z" fill="url(#water)"/>
<circle cx="1250" cy="455" r="10" fill="#ffffff" opacity="0.25"/>
<rect x="1186" y="606" width="22" height="10" rx="3" fill="#555"/><rect x="1342" y="606" width="22" height="10" rx="3" fill="#555"/>
</g>

<!-- Hot and cold water dispenser -->
<g filter="url(#sh)">
<path d="M1438 170 h84 a14 14 0 0 1 14 14 v86 a24 24 0 0 1 -24 24 h-64 a24 24 0 0 1 -24 -24 v-86 a14 14 0 0 1 14 -14 z" fill="url(#water)"/>
<rect x="1452" y="186" width="10" height="90" rx="5" fill="#ffffff" opacity="0.35"/>
<rect x="1462" y="292" width="36" height="16" rx="4" fill="#7fc9ee"/>
<rect x="1424" y="306" width="112" height="304" rx="12" fill="url(#white)"/>
<rect x="1440" y="340" width="80" height="80" rx="8" fill="#e2e6ec"/>
<rect x="1450" y="356" width="18" height="28" rx="4" fill="#e74c3c"/><rect x="1492" y="356" width="18" height="28" rx="4" fill="#2f80ed"/>
<rect x="1446" y="404" width="68" height="8" rx="4" fill="#b7bec8"/>
<rect x="1432" y="606" width="18" height="10" rx="3" fill="#555"/><rect x="1510" y="606" width="18" height="10" rx="3" fill="#555"/>
</g>
</svg>
