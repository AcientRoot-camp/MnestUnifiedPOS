<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
<!-- Branch illustration (Adum, Kumasi): a bright three-storey shop building on a busy street, yellow with green
     trim, an arched shop front with a long awning, windows above, bunting and street life, on a Kumasi evening.
     Used on the store's branch cards until the Admin uploads real photos (data/web.ts BRANCH_ART). -->
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1240"/><stop offset="0.6" stop-color="#3b23b8"/><stop offset="1" stop-color="#ff9a5b"/></linearGradient>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#f2b705"/></linearGradient>
<linearGradient id="lit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset="1" stop-color="#ffd39b"/></linearGradient>
<linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b4f58"/><stop offset="1" stop-color="#2b2e35"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/></filter>
</defs>
<rect width="1200" height="680" fill="url(#sky)"/>
<g fill="#ffffff"><circle cx="90" cy="60" r="2"/><circle cx="260" cy="40" r="2"/><circle cx="980" cy="50" r="2"/><circle cx="1120" cy="90" r="2"/><circle cx="620" cy="30" r="1.5"/></g>
<!-- Neighbouring buildings (silhouettes) -->
<g fill="#2a1d63" opacity="0.85"><rect x="0" y="230" width="230" height="330"/><rect x="40" y="190" width="120" height="40"/><rect x="970" y="250" width="230" height="310"/><rect x="1010" y="210" width="110" height="40"/></g>
<g fill="#ffd39b" opacity="0.7"><rect x="30" y="270" width="40" height="40"/><rect x="110" y="270" width="40" height="40"/><rect x="30" y="350" width="40" height="40"/><rect x="1010" y="290" width="40" height="40"/><rect x="1100" y="290" width="40" height="40"/><rect x="1100" y="370" width="40" height="40"/></g>
<!-- Pavement and road -->
<rect y="560" width="1200" height="36" fill="#bfb6a6"/><rect y="596" width="1200" height="84" fill="url(#road)"/>
<g fill="#f4f1ea" opacity="0.8"><rect x="80" y="632" width="90" height="8" rx="4"/><rect x="320" y="632" width="90" height="8" rx="4"/><rect x="560" y="632" width="90" height="8" rx="4"/><rect x="800" y="632" width="90" height="8" rx="4"/><rect x="1040" y="632" width="90" height="8" rx="4"/></g>

<!-- Main shop building -->
<g filter="url(#sh)">
<rect x="260" y="110" width="680" height="450" rx="4" fill="url(#wall)"/>
<rect x="250" y="96" width="700" height="22" rx="4" fill="#1f8a4c"/>
<rect x="250" y="250" width="700" height="12" fill="#1f8a4c"/>
<!-- Upper floors: lit windows -->
<g fill="url(#lit)"><rect x="300" y="140" width="100" height="90" rx="6"/><rect x="440" y="140" width="100" height="90" rx="6"/><rect x="660" y="140" width="100" height="90" rx="6"/><rect x="800" y="140" width="100" height="90" rx="6"/>
<rect x="300" y="280" width="100" height="80" rx="6"/><rect x="440" y="280" width="100" height="80" rx="6"/><rect x="660" y="280" width="100" height="80" rx="6"/><rect x="800" y="280" width="100" height="80" rx="6"/></g>
<rect x="566" y="140" width="68" height="220" rx="6" fill="#1f8a4c" opacity="0.9"/>
<!-- Sign -->
<rect x="340" y="374" width="520" height="46" rx="8" fill="#1a1240"/>
<text x="600" y="405" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffd166" letter-spacing="3">ELECTRONICS &amp; APPLIANCES</text>
<!-- Long awning -->
<path d="M270 428 H930 L952 464 H248 Z" fill="#1f8a4c"/>
<g fill="#ffd166"><path d="M320 428 H360 L368 464 H328 Z"/><path d="M420 428 H460 L468 464 H428 Z"/><path d="M520 428 H560 L568 464 H528 Z"/><path d="M620 428 H660 L668 464 H628 Z"/><path d="M720 428 H760 L768 464 H728 Z"/><path d="M820 428 H860 L868 464 H828 Z"/></g>
<!-- Arched shop front -->
<g fill="#1d2b4f"><path d="M286 560 V500 a40 40 0 0 1 80 0 V560 Z"/><path d="M396 560 V500 a40 40 0 0 1 80 0 V560 Z"/><path d="M724 560 V500 a40 40 0 0 1 80 0 V560 Z"/><path d="M834 560 V500 a40 40 0 0 1 80 0 V560 Z"/></g>
<g><rect x="300" y="500" width="52" height="36" rx="3" fill="#2f6fd6"/><rect x="410" y="496" width="24" height="60" rx="3" fill="#d9dde3"/><rect x="440" y="496" width="24" height="60" rx="3" fill="#d9dde3"/>
<rect x="736" y="500" width="56" height="18" rx="5" fill="#eef1f5"/><circle cx="874" cy="516" r="18" fill="none" stroke="#eef1f5" stroke-width="3"/></g>
<!-- Entrance -->
<path d="M540 560 V494 a60 60 0 0 1 120 0 V560 Z" fill="#fff3c4"/>
<path d="M556 560 V498 a44 44 0 0 1 88 0 V560 Z" fill="#ffd39b"/>
</g>
<!-- Bunting across the street -->
<path d="M0 70 Q600 150 1200 70" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
<g><path d="M80 82 l22 4 l-14 22 z" fill="#e63946"/><path d="M200 98 l22 3 l-13 22 z" fill="#ffd166"/><path d="M320 110 l22 2 l-12 22 z" fill="#2a9d8f"/><path d="M440 118 l22 1 l-11 22 z" fill="#e63946"/><path d="M560 121 l22 0 l-11 22 z" fill="#ffd166"/><path d="M680 120 l22 -1 l-10 22 z" fill="#2a9d8f"/><path d="M800 115 l22 -2 l-10 22 z" fill="#e63946"/><path d="M920 105 l22 -3 l-9 22 z" fill="#ffd166"/><path d="M1040 90 l22 -4 l-8 22 z" fill="#2a9d8f"/></g>
<!-- A delivery tricycle (okada-style box) parked outside -->
<g filter="url(#sh)"><rect x="1000" y="500" width="110" height="60" rx="6" fill="#0b5c5c"/><text x="1055" y="536" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff">DELIVERY</text>
<rect x="960" y="530" width="44" height="12" rx="6" fill="#2b2e35"/><circle cx="975" cy="566" r="16" fill="#1b1b1b"/><circle cx="1030" cy="566" r="16" fill="#1b1b1b"/><circle cx="1090" cy="566" r="16" fill="#1b1b1b"/></g>
</svg>
