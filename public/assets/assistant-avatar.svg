<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
<!-- Online store shop assistant avatar (pages/store/Chat.tsx): a smiling shop assistant with a headset, in the
     store's teal uniform with a gold name badge, inside a navy circle. Used on the chat button and in the chat header. -->
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b23b8"/><stop offset="1" stop-color="#1a1240"/></linearGradient>
<clipPath id="c"><circle cx="60" cy="60" r="60"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="120" height="120" fill="url(#bg)"/>
<circle cx="60" cy="56" r="44" fill="#ffffff" opacity="0.06"/>
<!-- Shoulders and uniform -->
<path d="M14 124 C16 96 34 84 60 84 C86 84 104 96 106 124 Z" fill="#0b5c5c"/>
<path d="M46 85 L60 100 L74 85 C70 83 66 82 60 82 C54 82 50 83 46 85 Z" fill="#ffffff"/>
<rect x="74" y="100" width="18" height="7" rx="2" fill="#f2b705"/>
<!-- Neck -->
<rect x="52" y="70" width="16" height="16" rx="6" fill="#7a4a2e"/>
<!-- Hair puff behind the head -->
<circle cx="60" cy="24" r="15" fill="#1b1b1b"/>
<!-- Head -->
<ellipse cx="60" cy="52" rx="23" ry="25" fill="#8a5636"/>
<!-- Hair -->
<path d="M37 50 C35 30 46 23 60 23 C75 23 86 31 83 50 C79 40 71 35 60 35 C49 35 41 40 37 50 Z" fill="#1b1b1b"/>
<!-- Face -->
<ellipse cx="51" cy="53" rx="2.8" ry="3.2" fill="#1b1b1b"/><ellipse cx="69" cy="53" rx="2.8" ry="3.2" fill="#1b1b1b"/>
<circle cx="52" cy="52" r="0.9" fill="#ffffff"/><circle cx="70" cy="52" r="0.9" fill="#ffffff"/>
<ellipse cx="46" cy="61" rx="4" ry="2.4" fill="#e07a5f" opacity="0.45"/><ellipse cx="74" cy="61" rx="4" ry="2.4" fill="#e07a5f" opacity="0.45"/>
<path d="M52 63 Q60 70 68 63" fill="none" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<!-- Headset -->
<path d="M35 52 C35 30 85 30 85 52" fill="none" stroke="#2b2b30" stroke-width="4" stroke-linecap="round"/>
<rect x="31" y="47" width="9" height="15" rx="4" fill="#f2b705"/>
<rect x="80" y="47" width="9" height="15" rx="4" fill="#f2b705"/>
<path d="M36 61 C38 70 44 72 51 70" fill="none" stroke="#2b2b30" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="52" cy="70" r="3" fill="#2b2b30"/>
</g>
</svg>
