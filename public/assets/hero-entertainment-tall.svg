<svg xmlns="http://www.w3.org/2000/svg" viewBox="680 56 916 580">
<!-- Tall version made by scripts/heroTall.py (do not edit by hand). Online store hero (built-in illustration 4 of 5): home entertainment. A large wall-mounted smart TV showing a
     football match, a soundbar, tower speakers, a subwoofer and a GOtv decoder on a low console, on a navy-to-violet
     light. Products sit between x 700 and 1570 so the heading on computers (left) and the right-aligned crop on
     phones never cover them. -->
<defs>
<linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1600" y2="720"><stop offset="0" stop-color="#1a1240"/><stop offset="0.55" stop-color="#6b3fa0"/><stop offset="1" stop-color="#ff7a6b"/></linearGradient>
<radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="1088" cy="288" r="620"><stop offset="0" stop-color="#ffd6f0" stop-opacity="0.55"/><stop offset="1" stop-color="#ffd6f0" stop-opacity="0"/></radialGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d1a55"/><stop offset="1" stop-color="#140b2e"/></linearGradient>
<linearGradient id="black" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2b30"/><stop offset="1" stop-color="#0d0d10"/></linearGradient>
<linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f9e4f"/><stop offset="1" stop-color="#1c6b33"/></linearGradient>
